<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login - StudyConnect</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#eef4ff;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:#fff;
padding:30px;
width:320px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,.15);
text-align:center;
}

h2{
color:#2b5cff;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:12px;
background:#2b5cff;
color:#fff;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#1d46d8;
}
</style>

</head>
<body>

<div class="login-box">
<h2>🎓 Student Login</h2>
<input type="text" id="userid" placeholder="Student ID">
<input type="password" id="password" placeholder="Password">
<button onclick="login()">Login</button>

</div>

<script>
function login(){
  let id = document.getElementById("userid").value;
  let pass = document.getElementById("password").value;

  if(id==="ABHAY" && pass==="09876"){
      alert("Student Login Successful");
      window.location.href="student-dashboard.html";
  }else{
      alert("Wrong ID or Password");
  }
}
</script>

</body>
</html>
